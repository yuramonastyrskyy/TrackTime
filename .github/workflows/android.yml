# Builds the TrackTime Android app (android/, a Capacitor shell around the
# live site) and publishes the APK as a GitHub Release.
#   push to main      -> release "app-v1.N" (marked latest):
#                        https://github.com/<repo>/releases/latest/download/TrackTime.apk
#   pull request      -> pre-release "app-preview": "TrackTime preview", a separate
#                        app that loads /preview/ (the newest open PR on Pages)
# Only when the app itself changes (android/, the Capacitor config, this file).
# The web app needs no new APK: the app loads the site, so merges reach it.
#
# Signing: repo secrets ANDROID_KEYSTORE_BASE64 (a PKCS12 keystore, base64),
# ANDROID_KEYSTORE_PASSWORD, optional ANDROID_KEY_ALIAS (default "tracktime").
# Without them the APK is signed with a throwaway debug key, and each new build
# then has to be installed after uninstalling the old one.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', 'capacitor.config.json', 'native/**', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'capacitor.config.json', 'native/**', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm ci
      - name: Preview build loads /preview/
        if: github.event_name == 'pull_request'
        run: |
          sed -i 's#"url": "https://yuramonastyrskyy.github.io/TrackTime/"#"url": "https://yuramonastyrskyy.github.io/TrackTime/preview/"#' capacitor.config.json
          grep -q '/TrackTime/preview/' capacitor.config.json
          echo "TT_APP_ID_SUFFIX=.preview" >> "$GITHUB_ENV"
          echo "TT_APP_NAME=TrackTime preview" >> "$GITHUB_ENV"
          echo "TT_VERSION_NAME=preview-${{ github.event.pull_request.number }}.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Version
        if: github.event_name != 'pull_request'
        run: echo "TT_VERSION_NAME=1.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Copy the shell into the Android project
        run: npx cap sync android
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tracktime.p12"
            echo "TT_KEYSTORE=$RUNNER_TEMP/tracktime.p12" >> "$GITHUB_ENV"
            echo "signed with the TrackTime key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway debug key"
          fi
      - name: Build the APK
        working-directory: android
        env:
          TT_VERSION_CODE: ${{ github.run_number }}
          TT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          name=TrackTime.apk
          [ "${{ github.event_name }}" = pull_request ] && name=TrackTime-preview.apk
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/$name"
          echo "APK=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}
      - name: Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="app-v$TT_VERSION_NAME"
          gh release create "$tag" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "TrackTime app $TT_VERSION_NAME" \
            --notes "Install TrackTime.apk on the Android phone (allow installs from the browser when asked). The app loads the live site, so web changes reach it without a new APK."
      - name: Pre-release for the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-preview --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create app-preview "$APK" --repo "$GITHUB_REPOSITORY" --target "${{ github.event.pull_request.head.sha }}" --prerelease --latest=false \
            --title "TrackTime preview app (PR #${{ github.event.pull_request.number }})" \
            --notes "Separate test app (\"TrackTime preview\") that loads https://yuramonastyrskyy.github.io/TrackTime/preview/. Installs next to the real app."
