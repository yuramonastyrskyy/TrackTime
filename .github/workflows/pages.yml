# Publishes the site to GitHub Pages:
#   /            the live app, from main
#   /preview/    the newest open pull request (from this repo), to try on the
#                phone before merging. It keeps its own settings, sessions,
#                recordings and offline cache, and shows a "PREVIEW" badge.
# Needs Settings > Pages > Source = "GitHub Actions".
# Runs on a push to main and after "Preview trigger" (any branch push or a PR
# opening/closing). Running from main is what lets it deploy to github-pages.
name: Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Preview trigger]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - name: Find the newest open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,headRefName,isCrossRepository,updatedAt \
            --jq '[.[] | select(.isCrossRepository | not)] | sort_by(.updatedAt) | last // empty')
          echo "found: ${pr:-none}"
          if [ -n "$pr" ]; then
            echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
            echo "branch=$(jq -r .headRefName <<<"$pr")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pr.outputs.number
        with:
          ref: ${{ steps.pr.outputs.branch }}
          path: pr
      - name: Build the site
        run: bash live/scripts/build-pages.sh live pr "${{ steps.pr.outputs.number }}" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
